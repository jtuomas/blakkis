image: node:12.12.0-buster

services:
  - postgres:9.6.5-alpine

cache:
  paths:
    - node_modules/

stages:
  - test

mocha:
  stage: test
  script:
    - npm install
    - npm install -g typescript
    - npm rebuild
    - export $(cat .env_tests)
    - tsc -p .
    - node dist/setup_test_db.js
    - ./node_modules/mocha/bin/mocha dist/test/*
